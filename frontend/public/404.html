<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Pascualinga Medical Link</title>
    <style>
      html,body{margin:0;padding:0;height:100%;background:#f8fafc;color:#0f172a;
        font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        display:flex;align-items:center;justify-content:center;text-align:center}
      .card{max-width:480px;padding:28px 24px;border-radius:16px;
        background:#ffffff;box-shadow:0 18px 60px rgba(15,23,42,.08);
        border:1px solid #e2e8f0}
      .pill{display:inline-block;padding:4px 10px;border-radius:999px;
        background:#fff7ed;color:#9a3412;font-size:.78rem;font-weight:600;letter-spacing:.2px;margin-bottom:14px}
      h1{margin:0 0 8px;font-size:1.35rem}
      p{margin:0 0 16px;font-size:.94rem;color:#475569;line-height:1.55}
      a.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;
        border-radius:10px;background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;
        text-decoration:none;font-weight:600;font-size:.9rem;box-shadow:0 10px 24px rgba(234,88,12,.22)}
    </style>
    <script>
      (function () {
        try {
          var key = 'pascualinga_404_restore_path';
          var path = window.location.pathname + window.location.search + window.location.hash;
          if (path && path !== '/') {
            window.sessionStorage.setItem(key, path);
          }
          window.location.replace('/?p404=1');
        } catch (err) {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <span class="pill">Redirecting…</span>
      <h1>Pascualinga Medical Link</h1>
      <p>Preparing your requested page. If you are not redirected automatically,
         tap Continue to go back to the homepage.</p>
      <a class="btn" href="/">Continue</a>
    </div>
  </body>
</html>
